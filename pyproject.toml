[project]
name = "my-digital-twin"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "eviva2000", email = "arjomandielaheh@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "gradio>=6.22.0",
    "numpy>=2.0.0",
    "openai>=2.53.0",
